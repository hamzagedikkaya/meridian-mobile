# The golden suite (test/golden/<area>_golden_test.dart + golden_harness.dart)
# renders every screen across the language × theme × text-scale matrix for
# visual review. The clock is pinned (4 Oct 2026, 09:41), but pixel output
# still depends on the host's font rasteriser, so it stays out of the default
# run. Shoot it deliberately:
#
#   flutter test                                                  # unit + widget suites
#   flutter test test/golden --run-skipped                        # compare screenshots
#   flutter test test/golden --run-skipped --update-goldens       # refresh them
tags:
  golden:
    skip: "visual-review harness — run: flutter test test/golden --run-skipped"
  # Conformance against a running Meridian server (test/live): the real
  # repository and Dio stack, a throwaway account's data created and deleted.
  #
  #   flutter test test/live --run-skipped
  live:
    skip: "needs a running Meridian server — run: flutter test test/live --run-skipped"
